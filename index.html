<!doctype html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7ede5" />

    <title>Portofolio</title>
    <meta
      name="description"
      content="Portofolio pribadi: profil, pengalaman, proyek, keahlian, pendidikan, dan kontak."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Portofolio" />
    <meta
      property="og:description"
      content="Portfolio bergaya Bento Grid / Neo-Brutalist Tech Editorial."
    />

    <!-- Fonts: Archivo Black (display) + Space Grotesk (sans) + JetBrains Mono (mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Cegah flash tema salah: baca localStorage sebelum React mount.
      (function () {
        try {
          var saved = localStorage.getItem('portfolio-theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {}
      })()
    </script>

    <!-- Tanpa JavaScript, semua elemen animasi harus tetap terlihat -->
    <noscript>
      <style>
        .reveal,
        .mask-line > span {
          opacity: 1 !important;
          translate: none !important;
          scale: none !important;
          filter: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
